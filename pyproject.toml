[project]
name = "medphys-agents"
version = "0.1.0"
description = "Tutorial LangGraph agents for medical physics research on HPC: connect, submit, analyze, report."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "langchain>=1.4",
    "langchain-anthropic>=1.7",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dicom = ["pydicom>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
medphys-agents = "medphys_agents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medphys_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
